[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "modern-chainer"
version = "0.8.0"
description = "A modern revival of Chainer: define-by-run deep learning with a Rust core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SaibaWaipu" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
manifest-path = "../crates/modern-chainer-python/Cargo.toml"
module-name = "chainer._chainer"
python-source = "."
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
