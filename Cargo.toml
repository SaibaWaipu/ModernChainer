[workspace]
resolver = "3"
members = [
    "crates/modern-chainer",
    "crates/modern-chainer-core",
    "crates/modern-chainer-autograd",
    "crates/modern-chainer-cpu",
    "crates/modern-chainer-nn",
    "crates/modern-chainer-optim",
    "crates/modern-chainer-data",
    "crates/modern-chainer-serial",
    "crates/modern-chainer-cuda",
    "crates/modern-chainer-vulkan",
    "crates/modern-chainer-run",
    "crates/modern-chainer-llm",
    "crates/modern-chainer-python",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/SaibaWaipu/ModernChainer"
authors = ["SaibaWaipu"]

[workspace.dependencies]
modern-chainer = { path = "crates/modern-chainer", version = "0.5.0" }
modern-chainer-core = { path = "crates/modern-chainer-core", version = "0.5.0" }
modern-chainer-cpu = { path = "crates/modern-chainer-cpu", version = "0.5.0" }
modern-chainer-autograd = { path = "crates/modern-chainer-autograd", version = "0.5.0" }
modern-chainer-nn = { path = "crates/modern-chainer-nn", version = "0.5.0" }
modern-chainer-optim = { path = "crates/modern-chainer-optim", version = "0.5.0" }
modern-chainer-data = { path = "crates/modern-chainer-data", version = "0.5.0" }
modern-chainer-serial = { path = "crates/modern-chainer-serial", version = "0.5.0" }
modern-chainer-cuda = { path = "crates/modern-chainer-cuda", version = "0.5.0" }
modern-chainer-vulkan = { path = "crates/modern-chainer-vulkan", version = "0.5.0" }
modern-chainer-run = { path = "crates/modern-chainer-run", version = "0.5.0" }
modern-chainer-llm = { path = "crates/modern-chainer-llm", version = "0.5.0" }
thiserror = "2.0"
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
rayon = "1.12"
criterion = "0.8"
pyo3 = { version = "0.30" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
