[package]
name = "modern-chainer-cuda"
description = "CUDA backend scaffold for Modern Chainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cuda"]
cuda = ["dep:cudarc"]

[dependencies]
modern-chainer-core.workspace = true
modern-chainer-cpu.workspace = true
modern-chainer-llm.workspace = true
bytemuck.workspace = true
half = "2.7"
cudarc = { version = "0.19", optional = true, features = ["cublas", "cublaslt", "nvrtc", "f16", "dynamic-loading", "cuda-12090"] }

[dev-dependencies]
modern-chainer-autograd.workspace = true
modern-chainer-nn.workspace = true
modern-chainer-optim.workspace = true
modern-chainer-run.workspace = true
serial_test = "4.0"
